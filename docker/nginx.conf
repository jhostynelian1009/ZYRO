server {
    listen PORT_PLACEHOLDER default_server;
    listen [::]:PORT_PLACEHOLDER default_server;
    server_name _;
    root /var/www/html/public;

    # Seguridad básica en encabezados HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php index.html;
    charset utf-8;

    # Permitir subida de imágenes de personalización (límite de 20MB)
    client_max_body_size 20M;

    # Compresión gzip para recursos estáticos
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Ruta de comprobación de salud de Laravel (/up)
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # Desactivar logs para favicon y robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Manejo de rutas y SPA / Blade
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    # Procesamiento de scripts PHP mediante PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Denegar acceso a archivos ocultos (excepto .well-known para certificados SSL)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

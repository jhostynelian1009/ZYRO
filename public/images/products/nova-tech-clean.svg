<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <rect width="600" height="700" fill="#F7F7F7"/>
  <!-- Chompa Nova Tech: Grafito técnico con cuello ergonómico y acentos reflectantes -->
  <g transform="translate(50, 40)">
    <!-- Cuerpo y mangas -->
    <path d="M 170 120 L 90 200 L 130 460 L 190 440 L 190 560 L 310 560 L 310 440 L 370 460 L 410 200 L 330 120 Z" fill="#2E3138" stroke="#1D1F24" stroke-width="3" stroke-linejoin="round"/>
    <!-- Canales de respirabilidad y acentos reflectantes -->
    <path d="M 210 240 L 290 240 M 200 300 L 300 300 M 210 360 L 290 360 M 220 420 L 280 420" stroke="#0055FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- Pretina y puños acanalados -->
    <rect x="190" y="540" width="120" height="20" fill="#22242A" stroke="#1D1F24" stroke-width="2"/>
    <rect x="130" y="445" width="60" height="15" fill="#22242A" stroke="#1D1F24" stroke-width="1.5" transform="rotate(-18 160 452)"/>
    <rect x="310" y="445" width="60" height="15" fill="#22242A" stroke="#1D1F24" stroke-width="1.5" transform="rotate(18 340 452)"/>
    <!-- Cuello alto ergonómico -->
    <path d="M 210 120 Q 250 140 290 120 L 295 90 Q 250 80 205 90 Z" fill="#1D1F24" stroke="#111" stroke-width="2"/>
    <path d="M 210 120 Q 250 140 290 120" fill="none" stroke="#0055FF" stroke-width="2"/>
  </g>
  <rect x="160" y="630" width="280" height="30" fill="#FFFFFF" stroke="#E0E0E0" rx="3"/>
  <text x="300" y="650" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#666666" text-anchor="middle">FOTOGRAFÍA EN PRODUCCIÓN</text>
</svg>

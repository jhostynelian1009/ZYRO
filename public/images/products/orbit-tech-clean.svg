<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <rect width="600" height="700" fill="#F7F7F7"/>
  <!-- Chompa Orbit Tech: Azul orbital profundo con panel térmico cinético -->
  <g transform="translate(50, 40)">
    <!-- Cuerpo y mangas -->
    <path d="M 170 120 L 90 200 L 130 460 L 190 440 L 190 560 L 310 560 L 310 440 L 370 460 L 410 200 L 330 120 Z" fill="#18233C" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Panel térmico cinético dorsal -->
    <path d="M 230 160 L 270 160 L 285 360 L 215 360 Z" fill="#1E2E50" stroke="#0055FF" stroke-width="1.5"/>
    <circle cx="250" cy="240" r="15" fill="none" stroke="#0055FF" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Pretina y puños acanalados -->
    <rect x="190" y="540" width="120" height="20" fill="#0F172A" stroke="#0A0F1D" stroke-width="2"/>
    <rect x="130" y="445" width="60" height="15" fill="#0F172A" stroke="#0A0F1D" stroke-width="1.5" transform="rotate(-18 160 452)"/>
    <rect x="310" y="445" width="60" height="15" fill="#0F172A" stroke="#0A0F1D" stroke-width="1.5" transform="rotate(18 340 452)"/>
    <!-- Cuello ergonómico -->
    <path d="M 210 120 Q 250 145 290 120 L 295 95 Q 250 85 205 95 Z" fill="#0F172A" stroke="#0A0F1D" stroke-width="2"/>
    <path d="M 210 120 Q 250 145 290 120" fill="none" stroke="#0055FF" stroke-width="2"/>
  </g>
  <rect x="160" y="630" width="280" height="30" fill="#FFFFFF" stroke="#E0E0E0" rx="3"/>
  <text x="300" y="650" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#666666" text-anchor="middle">FOTOGRAFÍA EN PRODUCCIÓN</text>
</svg>
